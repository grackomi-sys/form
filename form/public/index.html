<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oferty pracy – formularz kontaktowy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="karta">
    <h1>Oferty pracy</h1>
    <p class="opis">Wypełnij formularz, a wiadomość trafi prosto na naszą skrzynkę e-mail.</p>

    <form id="formularz">
      <label for="imie">Imię i nazwisko / firma</label>
      <input type="text" id="imie" name="imie" required maxlength="100">

      <label for="email">Twój e-mail</label>
      <input type="email" id="email" name="email" required maxlength="100">

      <label for="stanowisko">Stanowisko</label>
      <input type="text" id="stanowisko" name="stanowisko" maxlength="100">

      <label for="wiadomosc">Wiadomość</label>
      <textarea id="wiadomosc" name="wiadomosc" rows="6" required maxlength="5000"></textarea>

      <!-- pułapka na boty, nie usuwaj -->
      <input type="text" name="website" class="ukryte" tabindex="-1" autocomplete="off">

      <button type="submit" id="przycisk">Wyślij</button>
      <p id="status" role="status"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('formularz');
    const status = document.getElementById('status');
    const przycisk = document.getElementById('przycisk');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Wysyłanie...';
      status.className = '';
      przycisk.disabled = true;

      try {
        const dane = Object.fromEntries(new FormData(form));
        const odp = await fetch('/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dane),
        });
        const wynik = await odp.json();

        if (wynik.ok) {
          status.textContent = 'Dziękujemy! Wiadomość została wysłana.';
          status.className = 'ok';
          form.reset();
        } else {
          status.textContent = wynik.error || 'Coś poszło nie tak.';
          status.className = 'blad';
        }
      } catch {
        status.textContent = 'Brak połączenia z serwerem.';
        status.className = 'blad';
      }
      przycisk.disabled = false;
    });
  </script>
</body>
</html>
